# ~/.tmux.conf: copy mode, taught where the prompts are.
#
# handbook/config/tmux/README.md in the scriptlets repository.
#
# tmux 3.4 or newer.
# `previous-prompt` and `next-prompt`, and the `-o` flag both take,
# arrived there, and everything below is built on them.
# An older tmux reads this file without complaining
# and fails only when one of these keys is pressed:
# the name of a copy-mode command is not resolved until it runs.
#
# What marks the prompts is the shell, not tmux.
# tmux records two OSC 133 sequences against the lines they arrive on --
# A, a prompt starts here, and C, output starts here --
# and a shell that sends neither leaves every key below with nothing to find.
# ~/.zshrc is where this account's shells send them from.

# ---------------------------------------------------------------------------
# Prompt-to-prompt navigation in copy mode
#
# Bound in both key tables on purpose.
# tmux picks the table from the `mode-keys` option,
# whose default follows the $EDITOR and $VISUAL
# of the environment the *server* was started in
# and is `emacs` unless one of them contains `vi`.
# Neither editor these dotfiles set is a vi
# (~/.zshrc sets $EDITOR to an editor's `--wait` under VS Code and Positron),
# so binding `copy-mode-vi` alone would leave these keys inert
# on most of the machines they are installed on.
# `[` and `]` are unbound in both tables to begin with.
# ---------------------------------------------------------------------------
bind -T copy-mode    -N 'Previous prompt' [ send -X previous-prompt
bind -T copy-mode    -N 'Next prompt'     ] send -X next-prompt
bind -T copy-mode-vi -N 'Previous prompt' [ send -X previous-prompt
bind -T copy-mode-vi -N 'Next prompt'     ] send -X next-prompt

# ---------------------------------------------------------------------------
# prefix o -- copy the output of the last command
#
# The cursor walks the boundaries the shell marked:
# back to where the last command's output started (`previous-prompt -o`),
# then forward to the prompt that came after it,
# which is one line past the end of that output --
# hence the step back up before the selection is closed.
#
# `history-bottom` first, because `copy-mode` does nothing when the pane is
# already in copy mode: without it the key would mean "the output above
# wherever I happen to have scrolled to", which is not what it is called.
#
# The `if` is what keeps the key from taking the clipboard with it when there
# is nothing to copy. `next-prompt` does not move when no prompt is marked
# below the output -- the command is still running, or it printed nothing at
# all, or this pane has no marks in it (a shell without the marks, an ssh
# session, a full-screen program) -- and the selection would then end a line
# above where it began, which copies a stray newline over whatever was on the
# clipboard. The anchor carries the scroll position as well as the cursor row,
# because the row alone is measured against the visible screen and output
# longer than the window scrolls it out from under the comparison.
#
# This replaces the default `prefix o`, which selects the next pane;
# `prefix q` shows the pane numbers and takes one.
# ---------------------------------------------------------------------------
bind -N 'Copy the output of the last command' o {
  copy-mode
  send -X history-bottom
  send -X previous-prompt -o
  send -X begin-selection
  set -pF @copy-output-anchor '#{scroll_position}:#{copy_cursor_y}'
  send -X next-prompt
  if -F '#{==:#{scroll_position}:#{copy_cursor_y},#{@copy-output-anchor}}' {
    send -X cancel
  } {
    send -X cursor-up
    send -X end-of-line
    send -X copy-pipe-and-cancel
  }
}

# ---------------------------------------------------------------------------
# Where a copy goes
#
# `copy-pipe-and-cancel` with no command of its own falls back to the
# `copy-command` option, so the command is named in one place and every copy
# that reaches for it -- including the default mouse-drag bindings, on a
# machine where `mouse` has been switched on -- goes to the same clipboard.
#
# `pbcopy` exists on macOS alone and this file is installed everywhere,
# so the command itself lives in ~/.tmux-clipboard.conf,
# which only tag-macos/ ships.
# `-q` is what makes the file optional:
# where there is none, `copy-command` stays empty,
# a copy lands in the tmux paste buffer alone, and `prefix ]` pastes it.
#
# On a machine reached over ssh, `set -g set-clipboard on` is the other half
# of the answer: tmux would then offer its own copies to the terminal it is
# displayed on (OSC 52), which is the clipboard actually in front of you.
# The default, `external`, passes on what programs inside tmux ask for and
# keeps tmux's own copies to itself.
# ---------------------------------------------------------------------------
source-file -q ~/.tmux-clipboard.conf
