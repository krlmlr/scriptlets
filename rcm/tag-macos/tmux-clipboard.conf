# ~/.tmux-clipboard.conf: where a copy in tmux goes, on macOS.
#
# handbook/config/tmux/README.md in the scriptlets repository.
#
# Sourced by ~/.tmux.conf, which is installed on every platform;
# this file is installed where `pbcopy` is, and nowhere else.
#
# `copy-command` is what `copy-pipe-and-cancel` falls back to when it is
# given no command of its own, so one line covers every copy that reaches
# for it.
set -g copy-command pbcopy
