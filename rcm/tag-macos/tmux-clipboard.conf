# ~/.tmux-clipboard.conf: where a copy in tmux goes, on macOS.
#
# Sourced by ~/.tmux.conf, which is installed on every platform;
# this file is installed where `pbcopy` is, and nowhere else.
#
# `copy-command` is what `copy-pipe-and-cancel` falls back to
# when it is given no command of its own,
# and what the default mouse-drag bindings pipe through as well,
# so this one line covers `prefix o` and a mouse selection alike.
set -g copy-command pbcopy
