name: test

# The point of running on both: on Ubuntu the scripts are found because the
# stock ~/.profile puts ~/bin on the PATH, on macOS only because this
# repository ships the equivalent. Only the macOS job notices when that
# equivalent breaks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v5

      # zsh comes with macOS; on Ubuntu it is installed so that the checks
      # cover it there too, rather than skipping it.
      - name: Install rcm
        run: |
          case "$RUNNER_OS" in
          Linux)
            sudo apt-get update
            sudo apt-get install -y rcm zsh
            ;;
          macOS)
            brew install rcm
            ;;
          esac

      - uses: jdx/mise-action@v4
        with:
          # There are no tools to install; the tasks are all this repository
          # needs mise for.
          install: false
          cache: false

      # A checkout is not trusted until it is said to be, and `mise run` reads
      # no config it does not trust. tests/run passes the same trust down to
      # the tasks it runs against its throw-away home directory.
      - name: Trust the checkout
        run: mise trust

      # tests/run installs into a home directory of its own, so nothing here
      # depends on -- or disturbs -- the runner's own home directory.
      - name: Run checks
        run: mise run test
